limit_req_zone $binary_remote_addr zone=legacy_hub:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name hub.legacyhosting.xyz;
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        root /var/lib/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hub.legacyhosting.xyz;

    ssl_certificate /etc/letsencrypt/live/hub.legacyhosting.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hub.legacyhosting.xyz/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    access_log /var/log/nginx/lh-hub.access.log;
    error_log /var/log/nginx/lh-hub.error.log;
    root /var/www/legacy-hosting-hub;
    index index.html;
    client_max_body_size 256k;
    limit_req zone=legacy_hub burst=40 nodelay;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        root /var/lib/letsencrypt;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location /auth/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
